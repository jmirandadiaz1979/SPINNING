<script>
(function(){
 var K='cr_theme';
 function cfg(){try{var c=JSON.parse(localStorage.getItem(K)||'{}')||{};return{mode:c.mode||'dark',light:c.light||'07:30',dark:c.dark||'20:00'};}catch(e){return{mode:'dark',light:'07:30',dark:'20:00'};}}
 function mins(t){var p=String(t).split(':');return(+p[0]||0)*60+(+p[1]||0);}
 function eff(){var c=cfg();if(c.mode==='light'||c.mode==='dark')return c.mode;var d=new Date(),m=d.getHours()*60+d.getMinutes(),a=mins(c.light),b=mins(c.dark);return(a<b?(m>=a&&m<b):(m>=a||m<b))?'light':'dark';}
 function apply(){var t=eff();document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#f2f4f8':'#0b0f17');}
 var sa=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
 window.barPad=(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!sa)?140:0;
 document.documentElement.style.setProperty('--barpad',barPad+'px');
 window.themeCfg=cfg;
 window.themeSave=function(c){try{localStorage.setItem(K,JSON.stringify(c));}catch(e){}apply();};
 apply();setInterval(apply,60000);
 document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')apply();});
 document.addEventListener('change',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('thm')){var g=function(id){var x=document.getElementById(id);return x?x.value:'';};themeSave({mode:g('thm-mode')||'dark',light:g('thm-light')||'07:30',dark:g('thm-dark')||'20:00'});}});
})();
</script>
<style>

:root[data-theme=light]{color-scheme:light;--bg:#f2f4f8;--card:#ffffff;--card2:#eef2f8;--line:#aab6cc;--txt:#0b1220;--mut:#37445a;--acc:#0369a1;--acc-ink:#ffffff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--inset:#e5eaf3;--hov:#e3eaf6;--tagbg:#dbe3f1;--tagtx:#16223b;--topbg:rgba(242,244,248,.94);--runbg:#ffffff;--badbd:#e2a9a9;--badtx:#991b1b;--rowline:#d3dae8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

<header class="top"><div class="brand" style="display:flex;align-items:center;gap:8px"><div>CLASES <span>RODILLO</span></div><span style="flex:1"></span><button class="btn s" id="profchip" data-a="profMenu" style="letter-spacing:0;font-size:13px;color:var(--txt)"></button></div><nav id="nav"></nav></header>

<script id="engine">
'use strict';
/* =====================================================================
   MOTOR: segmentos, estadísticas, biblioteca y generador de clases
   Segmentos: s=constante, r=rampa, i=intervalos. Potencias en fracción de FTP.
   m = mensaje del "monitor" que se muestra/dice en el bloque. f=1 → recuperación flexible (se ajusta al tiempo).
   ===================================================================== */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
/* cadencia objetivo: por encima de 65 rpm se comprime (70-90 rpm de rodar habitual) */
const cf=c=>c?(c<=65?c:Math.round(65+(c-65)*.45)):c;
const ZC=['','#8a93a6','#3b82f6','#22c55e','#eab308','#f97316','#ef4444','#a855f7'];
const zoneOf=p=>p<.56?1:p<.76?2:p<.91?3:p<1.06?4:p<1.21?5:p<1.51?6:7;
const PZ=[[1,'Recuperación activa',0,.55],[2,'Resistencia',.56,.75],[3,'Tempo',.76,.90],[4,'Umbral',.91,1.05],[5,'VO2max',1.06,1.20],[6,'Capacidad anaeróbica',1.21,1.50],[7,'Neuromuscular',1.51,null]];
const HZ=[[1,'Recuperación',0,.81],[2,'Resistencia',.81,.89],[3,'Tempo',.90,.93],[4,'Sub-umbral',.94,.99],[5,'Umbral (5a)',1.00,1.02],[6,'VO2max (5b)',1.03,1.06],[7,'Anaeróbico (5c)',1.07,null]];

const s_=(sec,p,m,c,extra)=>Object.assign({t:'s',d:Math.round(sec),p,m,c},extra||{});
const r_=(sec,a,b,m,c)=>({t:'r',d:Math.round(sec),p:a,p2:b,m,c});
const i_=(n,on,pOn,off,pOff,m,m2,c,c2)=>({t:'i',n,d:Math.round(on),p:pOn,d2:Math.round(off),p2:pOff,m,m2,c,c2});
const fx=(sec,p,m,c)=>({t:'s',d:Math.round(sec),p,m,c,f:1});

function flatten(segs){
 const out=[];
 (segs||[]).forEach((g,gi)=>{
  if(g.t==='s')out.push({d:g.d,p0:g.p,p1:g.p,c:cf(g.c),m:g.m,tst:g.tst,tk:g.tk,free:g.free,gi});
  else if(g.t==='r')out.push({d:g.d,p0:g.p,p1:g.p2,c:cf(g.c),m:g.m,gi});
  else if(g.t==='i'){
   for(let k=0;k<g.n;k++){
    out.push({d:g.d,p0:g.p,p1:g.p,c:cf(g.c),m:g.m,gi,on:true,rep:k+1,n:g.n});
    if(g.d2>0)out.push({d:g.d2,p0:g.p2,p1:g.p2,c:cf(g.c2),m:g.m2,gi,off:true,rep:k+1,n:g.n});
   }
  }
 });
 return out.filter(s=>s.d>0);
}
function total(segs){let T=0;(segs||[]).forEach(g=>{T+=g.t==='i'?g.n*(g.d+(g.d2||0)):g.d;});return T;}
function stats(segs,ftp){
 const st=flatten(segs);let T=0;for(const s of st)T+=s.d;
 if(!T)return{dur:0,np:0,tss:0,avg:0,kj:0,steps:st};
 const arr=new Float32Array(T);let k=0;
 for(const s of st){for(let i=0;i<s.d;i++)arr[k++]=s.p0+(s.p1-s.p0)*((i+.5)/s.d);}
 let sum=0;for(let i=0;i<T;i++)sum+=arr[i];
 const avg=sum/T;
 let roll=0,acc=0,cnt=0;
 for(let i=0;i<T;i++){roll+=arr[i];if(i>=30)roll-=arr[i-30];if(i>=29){const m=roll/30;acc+=m*m*m*m;cnt++;}}
 const np=cnt?Math.pow(acc/cnt,.25):avg;
 return{dur:T,np,avg,tss:T*np*np/3600*100,kj:avg*ftp*T/1000,steps:st};
}
function zoneTimes(steps){
 const z=[0,0,0,0,0,0,0,0];
 steps.forEach(s=>{
  if(s.p0===s.p1){z[zoneOf(s.p0)]+=s.d;return;}
  const n=10;for(let k=0;k<n;k++)z[zoneOf(s.p0+(s.p1-s.p0)*((k+.5)/n))]+=s.d/n;
 });
 return z;
}
/* ajusta recuperaciones flexibles para clavar la duración exacta */
function fitTo(segs,target){
 const diff=target-total(segs);if(!diff)return segs;
 const fl=segs.filter(g=>g.f);
 if(!fl.length){
  if(diff>0){
   const n=Math.ceil(diff/150),parts=[];let left=diff;
   for(let i=0;i<n;i++){const d=Math.round(left/(n-i)/5)*5||left;parts.push(s_(i===n-1?left:d,.5,'Rodaje suave: suelta las piernas y respira',95));left-=parts[i].d;}
   segs.splice(segs.length-1,0,...parts);
  }
  return segs;
 }
 const base=fl.reduce((a,g)=>a+g.d,0);
 fl.forEach(g=>{g.d=Math.max(20,Math.round((g.d+diff*g.d/base)/5)*5);});
 const res=target-total(segs);
 if(res){const big=fl.reduce((a,g)=>g.d>a.d?g:a,fl[0]);big.d=Math.max(20,big.d+res);}
 return segs;
}
function validate(segs,D,test){
 const e=[];const T=total(segs);
 if(T!==D*60)e.push(`total ${T}s != ${D*60}s`);
 segs.forEach(g=>{
  if(g.t==='i'){if(g.d>240||(g.d2||0)>240)e.push('intervalo largo');}
  else if(g.f){if(g.d<30||g.d>300)e.push(`recup flex ${g.d}s`);}

function parseGPX(tx){
 const out=[],re=/<(?:trkpt|rtept)\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:trkpt|rtept)>)/g;let m;

function parseCSV(tx){
 const L=tx.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);if(L.length<3)return[];

 const hd=L[0].split(sep).map(x=>x.trim().toLowerCase());
 const isHead=hd.some(x=>/[a-z]/.test(x));
 let ci=-1,ce=-1,ct=-1,km=false;
 if(isHead){
  hd.forEach((h,i)=>{if(ci<0&&/dist|^km$|^d$/.test(h)){ci=i;if(/km/.test(h))km=true;}if(ce<0&&/ele|alt|elev|^h$|^z$/.test(h))ce=i;if(ct<0&&/time|tiempo|^t$|^sec/.test(h))ct=i;});
 }
 if(ci<0||ce<0){ci=0;ce=1;}
 const out=[];
 L.slice(isHead?1:0).forEach(l=>{const c=l.split(sep),d=_num(c[ci]),e=_num(c[ce]);let t=null;if(ct>=0){t=_num(c[ct]);if(t==null||/[-:T]/.test(c[ct]||''))t=_ts(c[ct]);}if(d!=null&&e!=null)out.push({dist:d,ele:e,t});});
 if(out.length){const mx=out[out.length-1].dist;if(km||mx<200)out.forEach(p=>p.dist*=1000);}
 return out;
}
function parseFIT(buf){
 const dv=new DataView(buf),hs=dv.getUint8(0),dsz=dv.getUint32(4,true);
 if(hs<12||String.fromCharCode(dv.getUint8(8),dv.getUint8(9),dv.getUint8(10),dv.getUint8(11))!=='.FIT')throw new Error('No es un archivo FIT válido');
 let o=hs;const end=Math.min(buf.byteLength-2,hs+dsz),defs={},out=[];
 while(o<end){
  const h=dv.getUint8(o++);let lt,isDef=false,dev=false;
  if(h&0x80){lt=(h>>5)&3;}
  else{isDef=!!(h&0x40);dev=!!(h&0x20);lt=h&15;}
  if(isDef){
   o++;const be=dv.getUint8(o++)===1,gm=dv.getUint16(o,!be);o+=2;const nf=dv.getUint8(o++),f=[];
   for(let i=0;i<nf;i++){f.push({n:dv.getUint8(o),s:dv.getUint8(o+1),t:dv.getUint8(o+2)&31});o+=3;}
   let ds=0;
   if(dev){const nd=dv.getUint8(o++);for(let i=0;i<nd;i++){ds+=dv.getUint8(o+1);o+=3;}}
   defs[lt]={be,gm,f,ds};
  }else{
   const d=defs[lt];if(!d)throw new Error('FIT dañado');
   const rec={};let p=o;
   d.f.forEach(f=>{

     if(f.s===4&&(f.n===0||f.n===1||f.n===5||f.n===78||f.n===253)){

     }else if(f.s===2&&f.n===2){const raw=dv.getUint16(p,le);if(raw!==0xFFFF)v=raw;}
     if(v!=null){

      else if(f.n===253)rec.ts=v+631065600;else if(f.n===5)rec.dist=v/100;else if(f.n===78)rec.ele78=v/5-500;else if(f.n===2)rec.ele2=v/5-500;
     }

   });
   o=p+d.ds;
   if(d.gm===20){const e=rec.ele78!=null?rec.ele78:rec.ele2;if(e!=null||rec.lat!=null)out.push({lat:rec.lat==null?null:rec.lat,lon:rec.lon==null?null:rec.lon,ele:e==null?null:e,dist:rec.dist==null?null:rec.dist,t:rec.ts==null?null:rec.ts});}
  }

}
/* puntos brutos → perfil con pendiente cada 20 m */
function buildClimb(raw,name,o){
 o=o||{};
 let pts=raw.filter(p=>p.ele!=null&&isFinite(p.ele));
 if(pts.length<10)throw new Error('El archivo no trae suficientes puntos con altitud (¿es una ruta sin datos de elevación?)');
 const hasD=pts.every(p=>p.dist!=null),hasT=pts.every(p=>p.t!=null&&isFinite(p.t));
 let cum=0,D=[],E=[],T=[];
 pts.forEach((p,i)=>{
  if(hasD)cum=p.dist;
  else if(i>0){const q=pts[i-1];if(p.lat==null||q.lat==null)throw new Error('Faltan coordenadas o distancias');cum+=_hav(q.lat,q.lon,p.lat,p.lon);}
  if(!D.length||cum-D[D.length-1]>=1){D.push(cum);E.push(p.ele);T.push(p.t);}
 });
 if(D.length<10)throw new Error('Puntos insuficientes');
 const d0=D[0];D=D.map(x=>x-d0);
 const L=D[D.length-1];if(L<1000)throw new Error('Recorrido demasiado corto (<1 km)');
 /* suavizado previo si hay muchos puntos densos (ruido GPS/barómetro) */
 const dens=L/D.length;
 if(dens<15){const w=Math.max(1,Math.round(40/dens)),S2=E.slice();for(let i=0;i<E.length;i++){let s=0,c=0;for(let j=Math.max(0,i-w);j<=Math.min(E.length-1,i+w);j++){s+=E[j];c++;}S2[i]=s/c;}E=S2;}
 /* tiempo en movimiento acumulado (se descartan paradas largas) */
 let Tm=null;
 if(hasT){Tm=[0];for(let q=1;q<D.length;q++){let dt=Math.max(0,T[q]-T[q-1]);const dd=D[q]-D[q-1];if(dt>15&&dd/dt<.8)dt=dd/2.5;Tm.push(Tm[q-1]+dt);}}
 /* remuestreo cada 20 m */
 const n=Math.floor(L/CL_STEP)+1,e=new Array(n),tn=Tm?new Array(n):null;let k=0;
 for(let i=0;i<n;i++){const x=i*CL_STEP;while(k<D.length-2&&D[k+1]<x)k++;const t=Math.min(1,Math.max(0,(x-D[k])/((D[k+1]-D[k])||1)));e[i]=E[k]+(E[k+1]-E[k])*t;if(tn)tn[i]=Tm[k]+(Tm[k+1]-Tm[k])*t;}
 /* suavizado ligero 3 puntos (60 m) */
 let es=e.map((v,i)=>i===0||i===n-1?v:(e[i-1]+2*v+e[i+1])/4);
 /* recorte: desde el mínimo previo hasta la cota máxima */
 let a=0,b=n-1;
 if(o.trim!==false){
  let imax=0;es.forEach((v,i)=>{if(v>es[imax])imax=i;});
  let imin=0;for(let i=0;i<=imax;i++)if(es[i]<es[imin])imin=i;
  a=imin;b=imax;
 }
 es=es.slice(a,b+1);
 let tm=null;
 if(tn){const t0=tn[a];tm=tn.slice(a,b+1).map(v=>Math.round(v-t0));const lenx=(tm.length-1)*CL_STEP,tt=tm[tm.length-1];let okm=tt>lenx/25&&tt<lenx/.5;for(let q=1;q<tm.length&&okm;q++)if(tm[q]<tm[q-1])okm=false;if(!okm)tm=null;}
 if(es.length<50)throw new Error('Tras recortar quedan menos de 1 km de subida');
 const g=[];for(let i=0;i<es.length-1;i++)g.push(Math.round(clamp((es[i+1]-es[i])/CL_STEP*100,-25,30)*10)/10);
 const len=g.length*CL_STEP;let gain=0;for(let i=0;i<es.length-1;i++)if(es[i+1]>es[i])gain+=es[i+1]-es[i];
 let mx=-99;for(let i=0;i+5<=g.length;i++){let s=0;for(let j=0;j<5;j++)s+=g[i+j];mx=Math.max(mx,s/5);}
 return{name:name||'Puerto',step:CL_STEP,e0:Math.round(es[0]),g,tm,len,gain:Math.round(gain),avg:Math.round((es[es.length-1]-es[0])/len*1000)/10,max:Math.round(mx*10)/10,n:g.length};
}
/* ---------- física ---------- */
const CL_PHY={cda:.35,crr:.004,rho:1.2,eff:.975,bike:8};
const climbMass=()=>(S.profile.weight||75)+CL_PHY.bike;
function climbSpeed(P,grade,m){
 const pw=P*CL_PHY.eff;if(pw<=0)return 0;
 const th=Math.atan(grade/100),F=m*9.81*(Math.sin(th)+CL_PHY.crr*Math.cos(th)),k=.5*CL_PHY.rho*CL_PHY.cda;
 let lo=0,hi=30;if(F<0)lo=Math.sqrt(-F/(3*k));
 for(let i=0;i<45;i++){const v=(lo+hi)/2;if(F*v+k*v*v*v>pw)hi=v;else lo=v;}
 return Math.min(16,(lo+hi)/2);
}
function climbPower(v,grade,m){
 const th=Math.atan(grade/100),F=m*9.81*(Math.sin(th)+CL_PHY.crr*Math.cos(th)),k=.5*CL_PHY.rho*CL_PHY.cda;
 return Math.max(0,(F*v+k*v*v*v)/CL_PHY.eff);
}
/* potencia objetivo por tramo de 20 m a velocidad de referencia constante, ajustada a una intensidad media */
function climbTargets(g,ftp,inten,m){
 const gs=g.map((x,i)=>.25*(g[Math.max(0,i-1)])+.5*x+.25*(g[Math.min(g.length-1,i+1)]));
 const lo=.45*ftp,hi=1.3*ftp,at=v=>gs.map(x=>clamp(climbPower(v,x,m),lo,hi));
 const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
 let a=.8,b=12;for(let i=0;i<40;i++){const v=(a+b)/2;if(mean(at(v))>inten*ftp)b=v;else a=v;}
 const v=(a+b)/2;return{vref:v,w:at(v).map(Math.round)};
}

/* ---------- análisis de actividad real (1 muestra/s) ---------- */
function analyzeSamples(smp,ftp,lthr){
 const dur=smp.length;if(dur<60)return null;
 const P=smp.map(x=>x.p!=null?x.p:0);
 let sum=0,mx=0;for(const v of P){sum+=v;if(v>mx)mx=v;}
 const avgP=sum/dur,hasPower=P.some(v=>v>0);
 let roll=0,acc=0,cnt=0;
 for(let i=0;i<dur;i++){roll+=P[i];if(i>=30)roll-=P[i-30];if(i>=29){const m=roll/30;acc+=m*m*m*m;cnt++;}}
 const np=cnt?Math.pow(acc/cnt,.25):avgP;
 const best=w=>{if(dur<w)return 0;let r=0,b=0;for(let i=0;i<dur;i++){r+=P[i];if(i>=w)r-=P[i-w];if(i>=w-1&&r>b)b=r;}return b/w;};
 let sh=0,nh=0,sc=0,nc=0,ci=0,cn=0;
 smp.forEach(x=>{
  if(x.hr!=null&&x.hr>30){sh+=x.hr;nh++;}
  if(x.cad!=null&&x.cad>0){sc+=x.cad;nc++;}
  if(x.tp>0&&x.p!=null){cn++;if(Math.abs(x.p-x.tp)<=x.tp*.08)ci++;}
 });
 const hr=nh?sh/nh:null,cad=nc?sc/nc:null;
 let tss;
 if(hasPower)tss=dur*Math.pow(np/ftp,2)/3600*100;
 else if(hr)tss=dur*Math.pow(hr/lthr,2)/3600*100;
 else tss=0;
 return{dur,avgP,np,maxP:mx,kj:sum/1000,hr,cad,tss,hasPower,best1:best(60),best5:best(300),comp:cn>60?ci/cn:null};
}

const BWIN=[[5,'5″'],[30,'30″'],[60,'1′'],[300,'5′'],[600,'10′'],[1200,'20′']];
const hzOf=r=>r<.81?1:r<.90?2:r<.94?3:r<1?4:r<1.03?5:r<1.07?6:7;
const fmtMin=s=>{const m=s/60;return(m>=10?Math.round(m):Math.round(m*10)/10)+'′';};
function meanMax(P,w){
 const n=P.length;if(n<w)return 0;
 let r=0,b=0;
 for(let i=0;i<n;i++){r+=P[i];if(i>=w)r-=P[i-w];if(i>=w-1&&r>b)b=r;}
 return b/w;

/* métricas profundas de una sesión con datos reales (1 muestra/s) */
function deepAnalyze(smp,ftp,lthr,np,avgP){
 const n=smp.length,P=smp.map(x=>x.p!=null?x.p:0),hasP=P.some(v=>v>0);
 const z=[0,0,0,0,0,0,0],hz=[0,0,0,0,0,0,0];
 let above=0,maxHr=0,hrN=0,hrS=0;
 for(let i=0;i<n;i++){
  if(hasP){const p=P[i];z[zoneOf(p/ftp)-1]++;if(p>ftp)above+=(p-ftp)/1000;}
  const h=smp[i].hr;
  if(h!=null&&h>30){hz[hzOf(h/lthr)-1]++;hrN++;hrS+=h;if(h>maxHr)maxHr=h;}
 }
 const bst={};
 if(hasP)BWIN.forEach(([w])=>{const v=meanMax(P,w);if(v>0)bst[w]=Math.round(v);});
 const avgHr=hrN?hrS/hrN:0;
 let dec=null;
 if(hasP&&hrN>n*.8&&n>=1200){
  const a0=300,a1=n-180,mid=Math.floor((a0+a1)/2);
  const seg=(i0,i1)=>{let sp=0,sh=0,c=0;for(let i=i0;i<i1;i++){if(smp[i].hr>30){sp+=P[i];sh+=smp[i].hr;c++;}}return c?sp/sh:0;};
  const r1=seg(a0,mid),r2=seg(mid,a1);
  if(r1>0&&r2>0)dec=Math.round((r1-r2)/r1*1000)/10;
 }
 return{z,hz:hrN?hz:null,bst:hasP?bst:null,maxHr,ef:(hasP&&avgHr)?Math.round(np/avgHr*100)/100:null,vi:(hasP&&avgP)?Math.round(np/avgP*100)/100:null,dec,above:Math.round(above)};
}

/* forma: serie diaria CTL / ATL / TSB */
function pmcSeries(){
 const t=todayISO(),days={};
 S.hist.forEach(h=>{days[h.date]=(days[h.date]||0)+h.tss;});
 const ds=Object.keys(days).sort();if(!ds.length)return[];
 const out=[];let ctl=0,atl=0;
 for(let d=ds[0];d<=t&&out.length<1500;d=addDays(d,1)){
  const x=days[d]||0;ctl+=(x-ctl)/42;atl+=(x-atl)/7;
  out.push({d,tss:x,ctl,atl,tsb:ctl-atl});
 }

}
function loadRisk(ser){
 const last=ser.slice(-7);
 if(last.length<7)return{mono:null,strain:null};
 const v=last.map(x=>x.tss),m=v.reduce((a,b)=>a+b,0)/7;
 if(m<=0)return{mono:null,strain:null};
 const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/7);
 const mono=sd>0?m/sd:9.9;
 return{mono:Math.min(9.9,mono),strain:v.reduce((a,b)=>a+b,0)*Math.min(9.9,mono)};
}

/* estímulo por dominio (min/semana) y marcador de progreso */
function domStats(){
 const t=todayISO(),a28=addDays(t,-27),a7=addDays(t,-6),p28=addDays(t,-55),p28b=addDays(t,-28);
 const first=S.hist.reduce((m,h)=>h.z&&(!m||h.date<m)?h.date:m,null);
 const span=first?Math.round((parseD(t)-parseD(first))/864e5)+1:0;
 const weeks=clamp(span/7,1,4);
 return DOMS.map(d=>{
  let s7=0,s28=0;
  S.hist.forEach(h=>{if(!h.z)return;const s=domSec(h.z,d);if(h.date>=a28)s28+=s;if(h.date>=a7)s7+=s;});
  const w=s28/60/weeks,last=s7/60,lo=d.ref[0],hi=d.ref[1];
  const st=w<lo?'bajo':w>hi*1.25?'alto':'ok';
  let prog=null;
  if(d.bw){
   const c=bestIn(a28,t,d.bw),p=bestIn(p28,p28b,d.bw);
   if(c.v&&p.v)prog={cur:c.v,prev:p.v,pct:(c.v/p.v-1)*100};
   else if(c.v)prog={cur:c.v,prev:0,pct:null};
  }else{
   const c=efIn(a28,t),p=efIn(p28,p28b);
   if(c&&p)prog={cur:c,prev:p,pct:(c/p-1)*100,ef:true};
   else if(c)prog={cur:c,prev:0,pct:null,ef:true};
  }

 });

/* gráfico de una sesión: potencia real, objetivo y FC */
function sessChart(smp,ftp){
 const n=smp.length;if(n<30)return'';
 const W=640,H=190,L=36,R=34,T=8,B=20,iw=W-L-R,ih=H-T-B,st=Math.max(1,Math.floor(n/320));
 const P=[],G=[],Hh=[];let mxp=ftp*1.3,hmn=999,hmx=0;
 for(let i=0;i<n;i+=st){
  let s=0,c=0;for(let j=Math.max(0,i-2);j<=Math.min(n-1,i+2);j++)if(smp[j].p!=null){s+=smp[j].p;c++;}
  const pv=c?s/c:null,tv=smp[i].tp||null,hv=(smp[i].hr!=null&&smp[i].hr>30)?smp[i].hr:null;
  P.push([i/(n-1),pv]);G.push([i/(n-1),tv]);Hh.push([i/(n-1),hv]);
  if(pv)mxp=Math.max(mxp,pv);if(tv)mxp=Math.max(mxp,tv);if(hv){hmn=Math.min(hmn,hv);hmx=Math.max(hmx,hv);}
 }
 mxp=Math.ceil(mxp*1.05/50)*50;
 const X=x=>L+x*iw,Y=y=>T+(1-y/mxp)*ih;
 let h='';
 for(let i=0;i<=4;i++){const v=mxp*i/4;h+=`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--rowline)"/><text x="${L-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" class="ax">${Math.round(v)}</text>`;}
 h+=`<line x1="${L}" x2="${W-R}" y1="${Y(ftp).toFixed(1)}" y2="${Y(ftp).toFixed(1)}" stroke="var(--mut)" stroke-dasharray="5 4"/><text x="${W-R-2}" y="${(Y(ftp)-3).toFixed(1)}" text-anchor="end" class="ax">FTP</text>`;
 const mins=Math.floor(n/60),tk=Math.max(1,Math.round(mins/6));
 for(let m=0;m<=mins;m+=tk)h+=`<text x="${X(m*60/(n-1)).toFixed(1)}" y="${H-6}" text-anchor="middle" class="ax">${m}′</text>`;
 h+=`<path d="${pathOf(G,X,Y)}" fill="none" stroke="var(--mut)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".9"/>`;
 h+=`<path d="${pathOf(P,X,Y)}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round"/>`;
 if(hmx>0){
  const lo=Math.floor((hmn-5)/10)*10,hi=Math.ceil((hmx+5)/10)*10,YH=v=>T+(1-(v-lo)/(hi-lo))*ih;
  h+=`<path d="${pathOf(Hh,X,YH)}" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linejoin="round" opacity=".9"/>`;
  [lo,hi].forEach(v=>{h+=`<text x="${W-R+4}" y="${(YH(v)+3).toFixed(1)}" class="ax" style="fill:#ef4444">${v}</text>`;});
 }
 return`<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Potencia, objetivo y FC de la sesión">${h}</svg>
 <div class="legend"><span><i style="background:var(--acc)"></i>Potencia real</span><span><i style="background:var(--mut)"></i>Objetivo</span>${hmx>0?'<span><i style="background:#ef4444"></i>FC</span>':''}</div>`;
}

/* ---------- historial ---------- */
function histStats(){
 const t=todayISO(),mon=mondayOf(t),d7=addDays(t,-6);
 let wT=0,wM=0,d7T=0,d7M=0;
 S.hist.forEach(h=>{
  if(h.date>=mon){wT+=h.tss;wM+=h.dur;}
  if(h.date>=d7){d7T+=h.tss;d7M+=h.dur;}
 });
 const days={};S.hist.forEach(h=>{days[h.date]=(days[h.date]||0)+h.tss;});
 const ds=Object.keys(days).sort();let ctl=0,atl=0;
 if(ds.length){for(let d=ds[0];d<=t;d=addDays(d,1)){const x=days[d]||0;ctl+=(x-ctl)/42;atl+=(x-atl)/7;}}
 return{wT,wM,d7T,d7M,ctl,atl,tsb:ctl-atl,n:S.hist.length};
}
function weekBars(){
 const mon=mondayOf(todayISO()),W=8,data=[];
 for(let i=W-1;i>=0;i--){
  const a=addDays(mon,-7*i),b=addDays(a,6);let tss=0,min=0;
  S.hist.forEach(h=>{if(h.date>=a&&h.date<=b){tss+=h.tss;min+=h.dur/60;}});
  data.push({a,tss,min});
 }
 const mx=Math.max(50,...data.map(x=>x.tss))*1.1,cw=60,H=130,Wd=W*cw+10;
 let h='';
 data.forEach((x,i)=>{
  const bh=x.tss/mx*(H-34),y=H-22-bh;
  h+=`<rect x="${i*cw+10}" y="${y}" width="${cw-16}" height="${bh}" rx="4" fill="var(--acc)" opacity=".85"/><text x="${i*cw+10+(cw-16)/2}" y="${y-4}" text-anchor="middle" style="font-size:11px;fill:var(--txt)">${Math.round(x.tss)}</text><text x="${i*cw+10+(cw-16)/2}" y="${H-6}" text-anchor="middle" style="font-size:10px;fill:var(--mut)">${parseD(x.a).getDate()}/${parseD(x.a).getMonth()+1}</text>`;
 });
 return`<div class="scroll"><svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}">${h}</svg></div>`;
}

function formaLabel(tsb){
 if(tsb<-30)return['Fatiga alta','warn','Riesgo de sobrecarga: prioriza descanso y rodajes suaves.'];
 if(tsb<-10)return['Carga productiva','ok','Estás acumulando carga útil. Respeta la recuperación entre sesiones duras.'];
 if(tsb<=5)return['Equilibrio','ok','Buen punto para seguir construyendo con una semana normal.'];

function coachInsights(){

 if(!ser.length)return L;

 L.push([fl[1],`<b>${fl[0]}</b> (TSB ${cur.tsb>=0?'+':''}${Math.round(cur.tsb)}). ${fl[2]}`]);
 if(ser.length>7){
  const ramp=cur.ctl-ser[ser.length-8].ctl;
  if(ramp>7)L.push(['warn',`Tu CTL sube ${ramp.toFixed(1)} puntos por semana: ritmo agresivo (más de 7). Intercala días suaves.`]);
  else if(ramp>=2)L.push(['ok',`CTL en ascenso (+${ramp.toFixed(1)}/semana): progresión sostenible.`]);
  else if(ramp<-3)L.push(['info',`Tu forma baja (${ramp.toFixed(1)} CTL/semana): si no es una descarga planificada, retoma la frecuencia.`]);
 }
 const risk=loadRisk(ser);
 if(risk.mono!=null&&risk.mono>2)L.push(['warn',`Monotonía alta (${risk.mono.toFixed(1)}): tus días se parecen demasiado. Alterna un día duro con uno suave o de descanso.`]);
 if(S.hist.some(h=>h.z)){
  const ds=domStats();
  ds.filter(d=>d.st==='bajo').slice(0,2).forEach(d=>L.push(['info',`Poco estímulo de <b>${d.n}</b> (${Math.round(d.w)}′/sem; referencia ${d.ref[0]}–${d.ref[1]}′). Clases: ${d.tags.join(', ')}.`]));
  ds.filter(d=>d.st==='alto').slice(0,1).forEach(d=>L.push(['warn',`Mucho <b>${d.n}</b> (${Math.round(d.w)}′/sem): equilibra con otros estímulos y vigila la fatiga.`]));
 }
 const sg=ftpSuggest();
 if(sg)L.push(['ok',`Tus esfuerzos demuestran un FTP de al menos <b>${sg.ftp} W</b> (tienes ${sg.cur} W). Puedes actualizarlo en «FTP y rendimiento».`]);
 const age=ftpAge();
 if(age!=null&&age>42)L.push(['info',`Hace ${age} días de tu último test de rampa: repítelo para afinar zonas y TSS.`]);
 else if(age==null&&S.hist.length>=6)L.push(['info','Aún no has hecho el test de rampa, la forma más fiable de fijar tu FTP (está en Clases).']);
 const w0=mondayOf(t);let ns=0;S.hist.forEach(h=>{if(h.date>=w0)ns++;});
 if(ns===0&&parseD(t).getDay()!==1)L.push(['info','Esta semana aún no has entrenado.']);
 return L.slice(0,7);
}

function sessImport(files){
 let add=0,dup=0,bad=0,left=files.length;
 const done=()=>{if(--left>0)return;S.hist.sort((a,b)=>(a.t0||0)-(b.t0||0));save();render();toast(`Sesiones importadas: ${add} nuevas${dup?`, ${dup} ya estaban`:''}${bad?`, ${bad} no válidas`:''}`);};
 files.forEach(f=>{
  const r=new FileReader();
  r.onload=()=>{
   try{
    const o=JSON.parse(r.result);
    const items=o&&o.rodillo==='sesion'?[o.item]:o&&o.rodillo==='sesiones'?o.items:null;
    if(!items)throw new Error('formato');
    items.forEach(it=>{
     if(!it||!it.entry||!it.entry.id){bad++;return;}
     if(S.hist.some(h=>h.id===it.entry.id)){dup++;return;}
     S.hist.push(it.entry);add++;
     if(it.samples&&it.samples.p){const a=getActs();a[it.entry.id]=it.samples;putActs(a);}
    });
   }catch(e){bad++;}
   done();
  };
  r.onerror=()=>{bad++;done();};
  r.readAsText(f);
 });
}

function driftCheck(R,P,H){
 if(!(P>0&&H>0))return;
 const dv=R.dv||(R.dv={bs:0,bp:0,bn:0,base:null,win:[],prev:[],last:-9999,cnt:0,drift:null}),ftp=S.profile.ftp;
 dv.prev.push(P);if(dv.prev.length>10)dv.prev.shift();
 if(dv.prev.length<10||R.t<240)return;
 const m=dv.prev.reduce((a,b)=>a+b,0)/10,sd=Math.sqrt(dv.prev.reduce((a,b)=>a+(b-m)*(b-m),0)/10);
 if(sd/m>.08||m/ftp<.5||m/ftp>1.05)return;
 const ef=P/H;
 if(dv.bn<120){dv.bs+=ef;dv.bp+=P;dv.bn++;if(dv.bn===120)dv.base={ef:dv.bs/120,p:dv.bp/120,t:R.t};return;}
 dv.win.push([ef,P]);if(dv.win.length>150)dv.win.shift();
 if(dv.win.length<120)return;
 const we=dv.win.reduce((a,x)=>a+x[0],0)/dv.win.length,wp=dv.win.reduce((a,x)=>a+x[1],0)/dv.win.length;
 if(Math.abs(wp-dv.base.p)>.2*dv.base.p)return;
 const d=(dv.base.ef-we)/dv.base.ef*100;dv.drift=Math.round(d*10)/10;
 if(d>=7&&R.t-dv.base.t>=420&&R.t-dv.last>300&&dv.cnt<3&&!R.alHold){dv.last=R.t;dv.cnt++;alertShow(R,'warn',`❤ La FC sube un ${Math.round(d)}% para la misma potencia: bebe, ventila y no te pases de ritmo`,12000);alertFx();}
}

function wallScan(g){
 const sm=g.map((x,i)=>(g[Math.max(0,i-1)]+x+g[Math.min(g.length-1,i+1)])/3),w=[];let i=0;
 while(i<sm.length){
  if(sm[i]>=12){let j=i;while(j+1<sm.length&&sm[j+1]>=11)j++;
   if(j-i+1>=3){let mx=0,t=0;for(let k=i;k<=j;k++){mx=Math.max(mx,sm[k]);t+=sm[k];}w.push({s:i*CL_STEP,e:(j+1)*CL_STEP,avg:t/(j-i+1),max:mx});}
   i=j+1;
  }else i++;
 }
 const out=[];w.forEach(x=>{const l=out[out.length-1];if(l&&x.s-l.e<100){const a=(l.e-l.s),b=(x.e-x.s);l.avg=(l.avg*a+x.avg*b)/(a+b);l.max=Math.max(l.max,x.max);l.e=x.e;}else out.push({...x});});
 return out;
}

 const pw=i=>R.samples.filter(x=>x.si===i&&x.p!=null).map(x=>x.p);
 const has=R.samples.some(x=>x.p!=null);
 const res={k,ok:false,lines:[],ftp:null,src:has?'bici':'plan'};
 const wk=v=>w?` (${(v/w).toFixed(2)} W/kg)`:'';
 if(k==='ramp'){
  let best=0,nOk=0;

   if(i>=R.idx&&!(R.finished&&!R.aborted))return;
   const a=pw(i);let v;
   if(has){if(a.length<45)return;v=a.reduce((x,y)=>x+y,0)/a.length;}else v=tgtW(R.steps[i].p0);

  res.lines=[`Mejor minuto completo (PAM): <b>${best} W</b>${wk(best)}`,`FTP estimado (75%): <b>${res.ftp} W</b>${wk(res.ftp)}`];
 }else if(k==='ftp20'||k==='ftp8'||k==='map5'){
  const key=k==='ftp20'?'e20':k==='ftp8'?'e8':'e5',idx=stepsOf(key),avgs=[];
  idx.forEach(i=>{if(i>R.idx)return;const a=pw(i),need=R.steps[i].d*.9;if(a.length>=need)avgs.push(a.reduce((x,y)=>x+y,0)/a.length);});
  if(!has){res.lines.push('Para medir la prueba necesitas la bici o el potenciómetro conectados.');return res;}
  if(avgs.length<idx.length){res.lines.push(`Esfuerzo incompleto: se necesita al menos el 90% de cada bloque (${idx.length-avgs.length} sin completar).`);return res;}
  const m=avgs.reduce((x,y)=>x+y,0)/avgs.length;res.ok=true;res.avg=Math.round(m);
  if(k==='ftp20'){res.ftp=Math.round(m*.95);res.lines=[`Media 20′: <b>${res.avg} W</b>${wk(res.avg)}`,`FTP (95%): <b>${res.ftp} W</b>${wk(res.ftp)}`];}
  else if(k==='ftp8'){res.ftp=Math.round(m*.90);res.lines=[`Media 8′: ${avgs.map(v=>Math.round(v)+' W').join(' y ')}`,`Promedio: <b>${res.avg} W</b>`,`FTP (90%): <b>${res.ftp} W</b>${wk(res.ftp)}`,avgs.length===2?`Caída entre esfuerzos: ${Math.round((1-avgs[1]/avgs[0])*100)}%`:''].filter(Boolean);}
  else{res.pam=res.avg;res.ftp=Math.round(m*.80);res.lines=[`PAM (media 5′): <b>${res.avg} W</b>${wk(res.avg)}`,`FTP aproximado (80%): <b>${res.ftp} W</b> — orientativo`];}
 }else if(k==='sprint'){
  if(!has){res.lines.push('Para medir los sprints necesitas la bici o el potenciómetro conectados.');return res;}
  let p1=0,p5=0,p15=0;
  stepsOf('sp').forEach(i=>{const a=pw(i);if(!a.length)return;p1=Math.max(p1,...a);p5=Math.max(p5,bestAvg(a,5));p15=Math.max(p15,bestAvg(a,Math.min(15,a.length)));});
  if(!p1){res.lines.push('No se registraron datos de potencia en los sprints.');return res;}
  res.ok=true;res.p1=Math.round(p1);res.p5=Math.round(p5);res.p15=Math.round(p15);
  res.lines=[`Pico 1″: <b>${res.p1} W</b>${wk(res.p1)}`,`Mejor 5″: <b>${res.p5} W</b>${wk(res.p5)}`,`Mejor 15″: <b>${res.p15} W</b>${wk(res.p15)}`,'Los sprints no cambian tu FTP: sirven para seguir tu potencia neuromuscular.'];
 }
 return res;
}

   BLUETOOTH (Web Bluetooth + FTMS): control ERG de la bici y registro real
   ===================================================================== */
const BT={dev:null,cp:null,ibd:null,connected:false,pending:null,q:Promise.resolve(),
 power:null,cad:null,hr:null,speed:null,hrDev:null,hrOn:false,hrName:'',name:'',
 sim:null,lastGrade:null,mult:1,erg:true,lastTarget:null,lastTargetT:0,lastData:0,hrData:0};
const btSupported=()=>typeof navigator!=='undefined'&&!!navigator.bluetooth;
function parseIBD(dv){
 let o=0;const fl=dv.getUint16(o,true);o+=2;const r={};
 if(!(fl&1)){r.speed=dv.getUint16(o,true)/100;o+=2;}
 if(fl&2)o+=2;
 if(fl&4){r.cad=dv.getUint16(o,true)/2;o+=2;}
 if(fl&8)o+=2;
 if(fl&16)o+=3;
 if(fl&32)o+=2;
 if(fl&64){r.power=dv.getInt16(o,true);o+=2;}
 if(fl&128)o+=2;
 if(fl&256)o+=5;
 if(fl&512){r.hr=dv.getUint8(o);o+=1;}
 return r;
}
function btOnData(e){
 try{
  const r=parseIBD(e.target.value);
  if(r.power!=null)BT.power=Math.max(0,r.power);
  if(r.cad!=null)BT.cad=Math.round(r.cad);
  if(r.speed!=null)BT.speed=r.speed;
  if(r.hr!=null&&r.hr>0&&!BT.hrOn)BT.hr=r.hr;
  BT.lastData=Date.now();
 }catch(err){console.warn(err);}
}
function btOnCp(e){
 const v=e.target.value;
 if(v.byteLength>=3&&v.getUint8(0)===0x80&&BT.pending&&BT.pending.op===v.getUint8(1))BT.pending.res(v.getUint8(2));
}
function btCmd(bytes,timeout){
 if(!BT.cp||!BT.connected)return Promise.resolve(null);
 const run=()=>new Promise(res=>{
  const op=bytes[0];
  const timer=setTimeout(()=>{BT.pending=null;res(null);},timeout||2500);
  BT.pending={op,res:code=>{clearTimeout(timer);BT.pending=null;res(code);}};
  const v=Uint8Array.from(bytes);
  const w=BT.cp.writeValueWithResponse?BT.cp.writeValueWithResponse(v):BT.cp.writeValue(v);
  Promise.resolve(w).catch(err=>{clearTimeout(timer);BT.pending=null;console.warn(err);res(null);});
 });
 BT.q=BT.q.then(run,run);return BT.q;
}
function btSetTarget(w){return btCmd([0x05,w&255,(w>>8)&255],1200);}
const btWait=ms=>new Promise(r=>setTimeout(r,ms));
async function btStep(name,fn){
 try{return await fn();}
 catch(e){const m=(e&&e.message)?e.message:String(e);const err=new Error('['+name+'] '+m);err.name=(e&&e.name)||'Error';err.step=name;throw err;}
}
async function btSetup(dev){
 try{dev.removeEventListener('gattserverdisconnected',btOnDisc);}catch(e){}
 dev.addEventListener('gattserverdisconnected',btOnDisc);
 let srv=null,lastErr=null;
 for(let i=0;i<3&&!srv;i++){
  try{srv=await btStep('conexión',()=>dev.gatt.connect());}
  catch(e){lastErr=e;try{dev.gatt.disconnect();}catch(_){}await btWait(700);}
 }
 if(!srv)throw lastErr;
 await btWait(400);
 let svc=null;
 for(let i=0;i<3&&!svc;i++){
  try{svc=await btStep('servicio FTMS',()=>srv.getPrimaryService(0x1826));}
  catch(e){lastErr=e;if(i===2)throw e;await btWait(600);}
 }
 BT.ibd=await btStep('datos 2AD2',()=>svc.getCharacteristic(0x2AD2));
 BT.cp=await btStep('control 2AD9',()=>svc.getCharacteristic(0x2AD9));
 BT.ibd.addEventListener('characteristicvaluechanged',btOnData);
 BT.cp.addEventListener('characteristicvaluechanged',btOnCp);
 let warn='';
 try{await btStep('notif. datos',()=>BT.ibd.startNotifications());}catch(e){warn+=' Sin datos en vivo ('+e.message+').';}
 await btWait(300);
 try{await btStep('notif. control',()=>BT.cp.startNotifications());}catch(e){warn+=' Sin confirmaciones de control ('+e.message+').';}
 try{const fc=await svc.getCharacteristic(0x2ACC),fv=await fc.readValue();BT.sim=!!(fv.getUint32(4,true)&(1<<13));}catch(e){BT.sim=null;}
 BT.dev=dev;BT.connected=true;BT.name=dev.name||'Bici';BT.q=Promise.resolve();BT.lastTarget=null;
 await btWait(300);
 const code=await btCmd([0x00]);
 if(code!==1&&code!==null)toast('La bici no concede el control de potencia (código '+code+'). Cierra otras apps conectadas a ella.');
 else if(code===null)toast('Conectada, pero no confirma el control ERG.'+warn+' Pruébalo con un bloque corto.');
 else toast('Conectada: '+BT.name+(warn?'.'+warn:''));
}
async function btPick(){
 const tries=[
  ['FTMS',{filters:[{services:[0x1826]}]}],
  ['nombre',{filters:[{namePrefix:'Zycle'}],optionalServices:[0x1826]}],
  ['todos',{acceptAllDevices:true,optionalServices:[0x1826]}]
 ];
 const errs=[];
 for(let i=0;i<tries.length;i++){
  try{return await navigator.bluetooth.requestDevice(tries[i][1]);}
  catch(e){
   if(e&&e.name==='NotFoundError')return null;
   errs.push(tries[i][0]+': '+((e&&e.name&&e.name!=='Error')?e.name+' ':'')+((e&&e.message)?e.message:e));
  }
 }
 const err=new Error('[buscar bici] '+errs.join(' | '));err.step='buscar';throw err;
}

  if(e&&e.name==='NotFoundError'&&!e.step)return;

}

const fkm=m=>(m/1000).toFixed(m<10000?2:1)+' km';
function climbEle(cl){const e=[cl.e0];for(let i=0;i<cl.g.length;i++)e.push(e[i]+cl.g[i]*CL_STEP/100);return e;}

function climbChart(cl,H){
 H=H||80;const n=cl.g.length,{e,mn,mx,rg}=climbScale(cl),W=1000;

function panPoint(cl,d,R){
 d=clamp(d,0,cl.len);const e=climbEle(cl),x=clamp(d/CL_STEP,0,cl.g.length),k=Math.min(cl.g.length-1,Math.floor(x));
 const ele=e[k]+cl.g[k]*CL_STEP/100*(x-k);
 let s=0,c=0;for(let j=Math.max(0,k-2);j<=Math.min(cl.g.length-1,k+2);j++){s+=cl.g[j];c++;}
 const gr=s/c,top=e[e.length-1];

 }

function climbImportFile(f){
 const nm=($('#cl-name')&&$('#cl-name').value.trim())||f.name.replace(/\.[^.]+$/,'');
 const trim=!$('#cl-trim')||$('#cl-trim').checked;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const buf=r.result;let raw;
   const u8=new Uint8Array(buf);
   const isFit=u8.length>12&&String.fromCharCode(u8[8],u8[9],u8[10],u8[11])==='.FIT';
   if(isFit)raw=parseFIT(buf);
   else{
    const tx=new TextDecoder('utf-8').decode(buf);
    if(/<trkpt|<rtept/i.test(tx))raw=parseGPX(tx);
    else if(/<Trackpoint/i.test(tx))raw=parseTCX(tx);
    else raw=parseCSV(tx);
   }
   const cl=buildClimb(raw,nm,{trim});
   cl.id=uid();
   const ref=CL_REF.find(x=>x.n.toLowerCase()===nm.toLowerCase());
   let warn='';
   if(ref){
    const dl=Math.abs(cl.len/1000-ref.km)/ref.km,dg=Math.abs(cl.gain-ref.gain)/ref.gain;
    if(dl>.1||dg>.12)warn=` ⚠ No cuadra con la referencia (${ref.km} km, +${ref.gain} m): revisa que el archivo sea la subida completa.`;
    else warn=' ✔ Coincide con la referencia.';
   }
   S.climbs.push(cl);if(S.climbs.length>30)S.climbs.shift();
   S.ui.cpend='';save();render();toast(`Importado: ${cl.name}, ${fkm(cl.len)}, +${cl.gain} m, ${cl.n} tramos.${warn}`);
  }catch(err){toast('No se pudo leer el perfil: '+err.message);}
 };
 r.readAsArrayBuffer(f);
}
function demoClimb(){
 /* puerto SINTÉTICO de pruebas (no es un puerto real): 7 km con rampas, falsos llanos y un muro */
 const g=[];for(let i=0;i<350;i++){const x=i*20;let v=6+3*Math.sin(x/600);if(x>2400&&x<2700)v=1;if(x>4300&&x<4700)v=12.5+1.5*Math.sin(x/90);if(x>6000)v=8+2*Math.sin(x/250);g.push(Math.round(v*10)/10);}
 let gain=0,mx=-99;g.forEach(v=>{if(v>0)gain+=v*CL_STEP/100;});
 for(let i=0;i+5<=g.length;i++){let s=0;for(let j=0;j<5;j++)s+=g[i+j];mx=Math.max(mx,s/5);}
 const len=g.length*CL_STEP,net=g.reduce((a,b)=>a+b,0)*CL_STEP/100;
 return{id:uid(),name:'Puerto de prueba (sintético)',demo:true,step:CL_STEP,e0:600,g,len,gain:Math.round(gain),avg:Math.round(net/len*1000)/10,max:Math.round(mx*10)/10,n:g.length};
}

const GH_LAB={rec:'Grabación original',pr:'Tu mejor tiempo',ref:'Ritmo objetivo'};
const ghostSources=cl=>[...(cl.tm?['rec']:[]),...(cl.pr?['pr']:[]),'ref'];
function ghostBuild(R){
 const cl=R.cl,av=ghostSources(cl);let src=S.ui.cghost;if(!av.includes(src))src=av[0];
 R.gsrc=src;
 R.gt=src==='rec'?cl.tm:src==='pr'?cl.pr:Array.from({length:cl.n+1},(_,i)=>Math.round(i*CL_STEP/R.tg.vref));
 const l=$('#r-lgd');if(l)l.textContent='⚪ tú · 🟠 '+GH_LAB[src];
}
function ghostT(R,d){const g=R.gt,x=clamp(d/CL_STEP,0,g.length-1),i=Math.min(g.length-2,Math.floor(x));return g[i]+(g[i+1]-g[i])*(x-i);}
function ghostD(R,t){
 const g=R.gt;if(t<=g[0])return 0;if(t>=g[g.length-1])return(g.length-1)*CL_STEP;
 let lo=0,hi=g.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(g[m]<=t)lo=m;else hi=m;}
 const f=(g[hi]-g[lo])?(t-g[lo])/(g[hi]-g[lo]):0;return(lo+f)*CL_STEP;
}

function climbSend(R){
 if(!BT.connected||!R.running)return;
 const md=R.mode,i=Math.min(R.cl.n-1,Math.floor(R.d/CL_STEP)),g=R.cl.g,now=performance.now();
 if(md==='sim'){
  const gs=.25*g[Math.max(0,i-1)]+.5*g[i]+.25*g[Math.min(g.length-1,i+1)],gr=Math.round(gs*10)/10;
  if(BT.lastGrade!==gr&&now-BT.lastTargetT>600){
   BT.lastGrade=gr;BT.lastTargetT=now;
   const gi=Math.round(gr*100),crr=Math.round(CL_PHY.crr/.0001),cw=Math.round(.5*CL_PHY.cda*CL_PHY.rho/.01);
   btCmd([0x11,0,0,gi&255,(gi>>8)&255,crr,cw],1500).then(code=>{
    if(code===2||code===3||code===4){R.simFail=true;BT.sim=false;BT.lastTarget=null;toast('Tu bici no admite el modo simulación: paso a ERG por pendiente.');climbOptBar();}
   });
  }
 }else if(md==='erg'){
  const w=Math.round(R.tg.w[i]*BT.mult);
  if(w!==BT.lastTarget&&(Math.abs(w-(BT.lastTarget||0))>=3||now-BT.lastTargetT>900)&&now-BT.lastTargetT>500){BT.lastTarget=w;BT.lastTargetT=now;btSetTarget(w);}
 }
}
function climbTick(){
 const R=RUN,now=performance.now();alertTick(R);
 if(R.running&&!R.finished){
  const dt=Math.min(1,(now-R.last)/1000);R.last=now;R.t+=dt;
  const md=climbMode();if(md!==R.mode){R.mode=md;BT.lastTarget=null;BT.lastGrade=null;climbOptBar();}
  const i=Math.min(R.cl.n-1,Math.floor(R.d/CL_STEP)),g=R.cl.g[i],tgt=Math.round(R.tg.w[i]*BT.mult);
  let P;
  if(BT.connected&&BT.power!=null){R.pe=R.pe==null?BT.power:R.pe+(BT.power-R.pe)*Math.min(1,dt/4);P=R.pe;}
  else P=tgt;
  R.v=climbSpeed(P,g,R.m);R.d+=R.v*dt;
  {const ni=Math.floor(R.d/CL_STEP);while(R.nn<=ni){R.nt[R.nn]=Math.round(R.t-(R.d-R.nn*CL_STEP)/Math.max(R.v,.3));R.nn++;}}
  R.sampAcc+=dt;
  if(BT.connected&&BT.power!=null){const kk=Math.floor(R.d/1000),o=R.kp[kk]||(R.kp[kk]=[0,0]);o[0]+=BT.power*dt;o[1]+=dt;}
  while(R.sampAcc>=1){R.sampAcc-=1;if(BT.connected||BT.hrOn){R.samples.push({p:BT.connected?BT.power:null,cad:BT.connected?BT.cad:null,hr:BT.hr,tp:md==='erg'?tgt:0,si:0});driftCheck(R,BT.connected?BT.power:null,BT.hr);}}
  {const km=Math.floor(R.d/1000);while(R.lk<km){R.lk++;kmSplit(R,R.lk);}}
  wallCheck(R);
  climbSend(R);
  if(R.d>=R.cl.len){R.d=R.cl.len;R.running=false;R.finished=true;beep(1319,.6);climbFinish();}
 }
 climbUI();

 panFollow:()=>{if(RUN){RUN.pm=null;RUN.panHold=0;panRunUpdate(RUN);panRunFollow(RUN);}},
 climbSkip:el=>{const R=RUN;if(R&&R.kind==='climb'&&!R.finished){R.skipped=true;R.d=clamp(R.d+(+el.dataset.v),0,R.cl.len-1);BT.lastGrade=null;climbUI();}},
 climbInt:el=>{const R=RUN;S.ui.cinten=clamp((S.ui.cinten||85)+(+el.dataset.v),60,110);if(R&&R.kind==='climb'){R.tg=climbTargets(R.cl.g,S.profile.ftp,S.ui.cinten/100,R.m);if(R.gsrc==='ref')ghostBuild(R);BT.lastTarget=null;climbOptBar();climbUI();}save();},
 climbModeToggle:()=>{const R=RUN;if(!R||R.kind!=='climb')return;S.ui.cmode=climbMode()==='sim'?'erg':'';R.simFail=false;BT.lastTarget=null;BT.lastGrade=null;save();climbOptBar();},
 profMenu:()=>profMenu(),
 profUse:el=>profSwitch(el.dataset.id),
 profNew:()=>{
  const n=(($('#pf-new')||{}).value||'').trim();if(!n){toast('Escribe un nombre');return;}
  const id=uid();PREG.list.push({id,name:n.slice(0,24),key:'rodillo_clases_v1_'+id,akey:'cr_acts_'+id});psaveReg();
  if(profSwitch(id,'prof'))toast('Perfil «'+n+'» creado: ajusta tu FTP y tu peso');
 },
 profRename:el=>{const p=PREG.list.find(x=>x.id===el.dataset.id);if(!p)return;const n=(prompt('Nombre del perfil',p.name)||'').trim();if(n){p.name=n.slice(0,24);psaveReg();renderNav();profMenu();}},
 profDel:el=>{
  const p=PREG.list.find(x=>x.id===el.dataset.id);if(!p||PREG.list.length<2)return;
  if(RUN){toast('Cierra la sesión primero');return;}
  if(!confirm('¿Borrar el perfil «'+p.name+'» con todo su historial? No se puede deshacer.'))return;
  try{localStorage.removeItem(p.key);localStorage.removeItem(p.akey);}catch(e){}
  const wasAct=p.id===PREG.act;PREG.list=PREG.list.filter(x=>x.id!==p.id);
  if(wasAct){PREG.act=PREG.list[0].id;psaveReg();profSwitch(PREG.act);}else{psaveReg();profMenu();}
 },
 runBump:el=>{if(RUN&&!RUN.finished){RUN.bump=clamp((RUN.bump||0)+(+el.dataset.v),-150,300);BT.lastTarget=null;runUI();}},
 runTcx:()=>{
  if(!RUN||RUN.samples.length<60)return;
  download(`rodillo_${iso(new Date((RUN.t0||Date.now()/1000)*1000))}.tcx`,toTCX(RUN.samples,RUN.t0||Math.floor(Date.now()/1000),cname(RUN.c)),'application/vnd.garmin.tcx+xml');
 },
 histOpen:el=>viewSession(el.dataset.id),
 histJson:el=>{const it=sessPack(el.dataset.id);if(!it){toast('Sesión no encontrada');return;}const e=it.entry;shareJSON(`rodillo_sesion_${e.date}_${pcur().name.replace(/\W+/g,'')}.json`,{rodillo:'sesion',v:1,from:pcur().name,item:it});},
 expSess:()=>{if(!S.hist.length){toast('No hay sesiones');return;}shareJSON(`rodillo_historial_${pcur().name.replace(/\W+/g,'')}_${todayISO()}.json`,{rodillo:'sesiones',v:1,from:pcur().name,items:S.hist.map(h=>sessPack(h.id))});},
 histTcx:el=>{
  const e=S.hist.find(h=>h.id===el.dataset.id),smp=actGet(el.dataset.id);
  if(!e||!smp){toast('No quedan datos de esta sesión');return;}
  download(`rodillo_${e.date}.tcx`,toTCX(smp,e.t0||Math.floor(Date.now()/1000),e.name),'application/vnd.garmin.tcx+xml');
 },
 ftpApply:el=>{
  const v=Math.round(+el.dataset.v);
  if(!(v>=50&&v<=600))return;
  if(confirm(`¿Cambiar tu FTP de ${S.profile.ftp} W a ${v} W?\nLas clases y las zonas se recalculan solas.`)){
   ftpApply(v,el.dataset.src||'rendimiento');el.disabled=true;toast('FTP actualizado a '+v+' W');
   if(!RUN){closeModal();render();}
  }
 },
 runDone:()=>{if(!RUN)return;runSave();toast('Guardada como hecha');runClose();},
 btConn:()=>{if(BT.connected){if(confirm('¿Desconectar la bici?'))btDisconnect();}else btConnect();},
 btHr:()=>btHrConnect(),
 btMinus:()=>{BT.mult=Math.max(.5,Math.round((BT.mult-.05)*100)/100);BT.lastTarget=null;btBar();},
 btPlus:()=>{BT.mult=Math.min(1.5,Math.round((BT.mult+.05)*100)/100);BT.lastTarget=null;btBar();},
 btErg:()=>{BT.erg=!BT.erg;S.ui.erg=BT.erg;save();btBar();if(RUN&&RUN.kind==='climb'){BT.lastTarget=null;BT.lastGrade=null;climbOptBar();}}
};
document.addEventListener('click',e=>{
 const m=$('#modal');
 if(e.target===m){closeModal();return;}
 const el=e.target.closest('[data-a]');if(!el)return;
 const fn=A[el.dataset.a];
 if(fn){e.preventDefault();try{fn(el,e);}catch(err){console.error(err);toast('Error: '+err.message);}}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(RUN)runClose();else if(!$('#modal').classList.contains('hidden'))closeModal();}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.gen==='D'){GENOPT.D=+el.value;const v=$('#g-dv');if(v)v.textContent=el.value+'′';}
});
document.addEventListener('change',e=>{
 const el=e.target,ch=el.dataset&&el.dataset.ch;
 if(el.dataset&&el.dataset.gen){
  const k=el.dataset.gen;
  if(k==='D')GENOPT.D=+el.value;else if(k==='focus')GENOPT.focus=el.value;else if(k==='lv')GENOPT.lv=+el.value;
  genRun();render();return;
 }
 if(ch){
  const u=S.ui;
  if(ch==='q'){u.q=el.value;u.lim=24;}
  else if(ch==='fd'){u.fd=el.value;u.lim=24;}
  else if(ch==='ft'){u.ft=el.value;u.lim=24;}
  else if(ch==='fl'){u.fl=+el.value;u.lim=24;}
  else if(ch==='sort'){u.sort=el.value;}
  else if(ch==='fav'){u.fav=el.checked;u.lim=24;}
  else if(ch==='hp'){u.hp=el.value;}
  else if(ch==='prof'){const v=parseFloat(el.value);if(v>0){if(el.dataset.k==='ftp'&&v!==S.profile.ftp)S.ftpLog.push({d:todayISO(),ftp:v,src:'manual'});S.profile[el.dataset.k]=v;}}
  save();render();return;
 }
 if(el.id==='impSess'){const fs=Array.from(el.files||[]);if(fs.length)sessImport(fs);el.value='';return;}
 if(el.id==='impClimb'){const f=el.files&&el.files[0];if(f)climbImportFile(f);el.value='';return;}
 if(el.id==='imp'){
  const f=el.files&&el.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
   try{
    const o=JSON.parse(r.result);
    if(!o||typeof o!=='object'||!o.profile)throw new Error('Archivo no válido');
    if(!confirm('Esto sustituye todos los datos actuales por los del archivo. ¿Continuar?'))return;
    const d=defState();
    S={...d,...o,profile:{...d.profile,...o.profile},ui:{...d.ui,...(o.ui||{})}};
    ['hist','fav','saved','ftpLog','climbs'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});
    if(!S.ftpLog.length)S.ftpLog=[{d:todayISO(),ftp:S.profile.ftp,src:'inicial'}];
    save();render();toast('Datos importados');
   }catch(err){toast('No se pudo importar: '+err.message);}
  };
  r.readAsText(f);
 }
});

/* ============ ARRANQUE ============ */
load();
render();

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
